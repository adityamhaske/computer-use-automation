name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI runs entirely offline after dependency installation. No API key is
# configured here on purpose: if any test needs the LLM, CI must fail.
env:
  PYTHONUNBUFFERED: "1"
  CUA_HEADLESS: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Chromium
        run: .venv/bin/python -m playwright install chromium --with-deps

      - name: Lint
        run: .venv/bin/python -m ruff check src tests apps evals scripts

      - name: Format check
        run: .venv/bin/python -m ruff format --check src tests apps evals scripts

      - name: Type check (strict)
        run: .venv/bin/python -m mypy

      - name: Architectural invariants
        run: .venv/bin/lint-imports

      - name: Tests (offline; live tests deselected)
        run: .venv/bin/python -m pytest

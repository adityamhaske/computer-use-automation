name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI runs entirely offline after dependency installation. No API key is
# configured here on purpose: if any test needs the LLM, CI must fail.
env:
  PYTHONUNBUFFERED: "1"
  CUA_HEADLESS: "true"

# Read-only by default: nothing here needs to write to the repo.
permissions:
  contents: read

# `push: **` plus `pull_request` runs every PR-branch commit twice, and a superseded run is wasted
# minutes. Newer pushes cancel the older run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the secret scan below can look at every commit and not only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Chromium
        run: .venv/bin/python -m playwright install chromium --with-deps

      # Every step below calls the same target a contributor runs locally. These were
      # hand-copied commands until they drifted twice in one change: the lint paths still
      # named a package that had moved, and the invariants step called `lint-imports`
      # directly, so the traceability checker added to `make invariants` never ran here at
      # all. `make check` is documented as "what CI runs" -- so CI has to actually run it.
      # Separate steps, so a failure still names its stage in the CI UI.
      - name: Lint and format
        run: make lint

      - name: Type check (strict)
        run: make typecheck

      - name: Architectural invariants
        run: make invariants

      # This system's safety story is redaction, so a key committed anywhere in history would
      # undercut it. Cheap, dependency-free, and it never echoes what it found.
      - name: Secret scan (tree and history)
        run: make secrets HISTORY=1

      - name: Tests (offline; live tests deselected)
        run: make test

      # The suite above tests the system from the inside; none of it runs the command the README
      # puts in front of a first-time reader. That gap is how `./start.sh ui` came to serve a
      # console with an empty queue while every component under it stayed green.
      - name: Reviewer path (smoke)
        run: make smoke

      # The end-to-end demo story is what this submission is assessed on. If it stops running, that
      # should fail here rather than in front of someone reading the README.
      - name: The demo a reviewer runs
        run: make demo

      # What a reviewer is shown is the demo's evidence, so keep exactly what this run produced. CI
      # has no model key on purpose, so its discovery stage says it ran from the recorded transcript.
      - name: Upload the demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence-${{ github.sha }}
          path: |
            evidence/discovery/demo-discovery/
            evidence/replay/demo-*/
            evidence/escalation/demo-escalation/
          retention-days: 14
          if-no-files-found: warn

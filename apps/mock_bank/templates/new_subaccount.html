{% extends "_shell.html" %}{% block content %}
{# The multi-field form with a confirmation step.
   NOTE what these controls deliberately lack: no `title`, no `<label for>`, no placeholder, no id.
   They have NO accessible name at all. A resolver cannot match them semantically -- the only way in
   is `structural_anchor` ("the control in the row whose label cell reads 'Account Type'").
   The search field has a title and these do not, so one artifact exercises both ends of the ladder. #}
<table class="{{ v.css_form_table }}" cellpadding="4" cellspacing="0" border="0">
  <tr><td colspan="2"><b>Open Sub-Account &mdash; {{ member.name }} ({{ member.member_id }})</b></td></tr>
  {% if error %}<tr><td colspan="2"><font color="#cc0000">{{ error }}</font></td></tr>{% endif %}
  <form method="post" action="/member/{{ member.member_id }}/new-subaccount">
  <tr>
    <td class="{{ v.css_label_cell }}">{{ v.label_acct_type }}</td>
    <td>
      <select name="{{ v.field_acct_type }}" class="{{ v.css_input }}">
        <option value="">-- select --</option>
        <option value="savings">Savings</option>
        <option value="checking">Checking</option>
        <option value="certificate">Certificate</option>
      </select>
    </td>
  </tr>
  <tr>
    <td class="{{ v.css_label_cell }}">{{ v.label_initial_deposit }}</td>
    <td><input type="text" name="{{ v.field_deposit }}" class="{{ v.css_input }}" size="14"></td>
  </tr>
  <tr>
    <td></td>
    <td><input type="submit" class="{{ v.css_button }}" value="{{ v.label_open_btn }}"></td>
  </tr>
  </form>
</table>

<div style="margin-top: 16px;">
  <a href="/member/{{ member.member_id }}" style="display: inline-flex; align-items: center; padding: 8px 16px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; color: #334155; font-size: 13px; font-weight: 500; text-decoration: none; transition: all 0.15s;">&larr; Cancel</a>
</div>
{% endblock %}

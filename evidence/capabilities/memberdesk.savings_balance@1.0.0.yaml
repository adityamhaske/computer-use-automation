schema_version: 1.0.0
id: memberdesk.savings_balance
version: 1.0.0
title: 'Looked up member 12345 (Ada Lovelace) and retrieved their savings account details: balance of
  $4,210.55, status Active, as of 09/11/2026.'
description: Look up member 12345 and report their savings account balance, the account status, and the
  as-of date.
surface:
  kind: legacy_web
  driver_capabilities:
    - semantic_tree
    - screenshot
  app:
    vendor: acme-core
    product: MemberDesk
entrypoint:
  url_pattern: http://127.0.0.1:8811
inputs:
  - name: member_number
    type: string
    required: true
    description: Supplied per invocation. Observed once during discovery as '12345'.
    pattern: ^[0-9]{4,12}$
    example: '12345'
    sensitive: false
outputs:
  - name: savings_balance
    type: money
    description: Observed during discovery as '$4,210.55'.
    source:
      step: read_savings_balance
    sensitive: false
  - name: account_status
    type: string
    description: Observed during discovery as 'Active'.
    source:
      step: read_account_status
    sensitive: false
  - name: as_of_date
    type: date
    description: Observed during discovery as '09/11/2026'.
    source:
      step: read_as_of_date
    sensitive: false
steps:
  - id: type_text_member_number
    description: Enter member number 12345 to search for the member.
    action:
      type: type
      target:
        role: textbox
        name:
          value: Member Number
          match: exact
        scope:
          frame: content
        anchor:
          relation: row_of
          text: Member Number
          match: normalized
        hints:
          css: input[name="memno"]
        fingerprint: ea2237aa18a5e0e3
        recorded_strategy: semantic_exact
      value:
        $input: member_number
      clear_first: true
    wait:
      for: snapshot_stable
      timeout_ms: 3000
    risk: safe
  - id: click_search
    description: Search for member 12345 to retrieve their account information.
    action:
      type: click
      target:
        role: button
        name:
          value: Search
          match: exact
        scope:
          frame: content
        anchor:
          relation: row_of
          text: Search
          match: normalized
        hints:
          css: input.btn1
        fingerprint: 7597c82cb4ec8e3c
        recorded_strategy: semantic_exact
    wait:
      for: navigation
      timeout_ms: 8000
    risk: safe
  - id: read_savings_balance
    description: Record the savings account balance for member 12345.
    action:
      type: extract
      target:
        role: cell
        scope:
          frame: content
        anchor:
          relation: adjacent_to
          text: Savings Balance
          match: normalized
        fingerprint: '6272691489291274'
        recorded_strategy: structural_anchor
      into: savings_balance
    wait:
      for: snapshot_stable
      timeout_ms: 3000
    risk: safe
  - id: read_account_status
    description: Record the savings account status for member 12345.
    action:
      type: extract
      target:
        role: cell
        scope:
          frame: content
        anchor:
          relation: adjacent_to
          text: Status
          match: normalized
        fingerprint: a565b77dfbd0bf06
        recorded_strategy: structural_anchor
      into: account_status
    wait:
      for: snapshot_stable
      timeout_ms: 3000
    risk: safe
  - id: read_as_of_date
    description: Record the as-of date for the savings account balance.
    action:
      type: extract
      target:
        role: cell
        name:
          value: 09/11/2026
          match: exact
        scope:
          frame: content
        anchor:
          relation: adjacent_to
          text: As Of
          match: normalized
        fingerprint: 2ff3d53e4486a110
        recorded_strategy: semantic_exact
      into: as_of_date
    wait:
      for: snapshot_stable
      timeout_ms: 3000
    risk: safe
checkpoint:
  assert: all_of
  of:
    - assert: node_exists
      query:
        role: cell
        name_matches: ^\$?-?[0-9,]+\.[0-9]{2}$
        scope:
          frame: content
      min_count: 1
    - assert: node_exists
      query:
        role: cell
        name: Savings Balance
      min_count: 1
    - assert: node_exists
      query:
        role: cell
        name: Status
      min_count: 1
    - assert: node_exists
      query:
        role: cell
        name_matches: ^\d{1,2}/\d{1,2}/\d{4}$|^\d{4}-\d{2}-\d{2}$
        scope:
          frame: content
      min_count: 1
    - assert: node_exists
      query:
        role: cell
        name: As Of
      min_count: 1
escalation:
  triggers:
    - target_ambiguous
    - target_not_found
    - checkpoint_failed
    - recovery_exhausted
    - unexpected_state
  policy: pause_and_request_human
policy:
  max_steps: 40
  max_duration_ms: 120000
provenance:
  discovered_by:
    model: auto
    run_id: disc-0a7e7b7ccd
    at: '2026-09-15T12:37:40.733380+00:00'
  transcript_ref: evidence/discovery/disc-0a7e7b7ccd/trace.jsonl
  notes: "Compiled from a single discovery run. Before approving, a reviewer should confirm:\n\n  1. Outcomes.\
    \ This run saw only the successful path, so NO business outcomes are declared. Every\n     legitimate\
    \ non-success answer this flow can return -- record not found, permission denied, a\n     closed account\
    \ -- must be added, or replay will classify each of them as UNEXPECTED_STATE and\n     escalate to\
    \ a human instead of answering the caller.\n  2. Recovery. No recovery rules are declared for the\
    \ same reason. Transient conditions this\n     application can produce (gateway errors, session expiry,\
    \ interstitial notices) need declaring.\n  3. Parameters. Check that the lifted inputs are the ones\
    \ that should vary per call, and that\n     nothing that should vary was left as a literal.\n  4.\
    \ Checkpoint. It asserts the shape of the extracted outputs. Confirm that is genuinely specific\n\
    \     to this goal rather than true of any page in the application.\n\nThese are gaps, not omissions:\
    \ inventing detectors a run never observed would produce a capability\nwhose error handling is fiction."
content_hash: sha256:94475021352cb539bf3d827f2a877e1b0615a085274bb79b303e357f3443d9a3

schema_version: 1.0.0
id: memberdesk.savings_balance
version: 1.0.0
title: Read member 12345's savings balance
description: Look up member 12345 and read their current savings balance
surface:
  kind: legacy_web
  driver_capabilities:
    - semantic_tree
    - screenshot
  app:
    vendor: acme-core
    product: MemberDesk
entrypoint:
  url_pattern: '{base_url}/'
inputs:
  - name: member_number
    type: string
    required: true
    description: Supplied per invocation. Observed once during discovery as '12345'.
    pattern: ^[0-9]{4,12}$
    example: '12345'
    sensitive: false
outputs:
  - name: savings_balance
    type: money
    description: Observed during discovery as '$4,210.55'.
    source:
      step: read_savings_balance
    sensitive: false
  - name: account_status
    type: string
    description: Observed during discovery as 'Active'.
    source:
      step: read_account_status
    sensitive: false
steps:
  - id: type_text_member_number
    description: enter the member number
    action:
      type: type
      target:
        role: textbox
        name:
          value: Member Number
          match: exact
        scope:
          frame: content
        anchor:
          relation: row_of
          text: Member Number
          match: normalized
        hints:
          css: input[name="memno"]
        fingerprint: ea2237aa18a5e0e3
        recorded_strategy: semantic_exact
      value:
        $input: member_number
      clear_first: true
    wait:
      for: snapshot_stable
      timeout_ms: 3000
    risk: safe
  - id: click_search
    description: run the search
    action:
      type: click
      target:
        role: button
        name:
          value: Search
          match: exact
        scope:
          frame: content
        anchor:
          relation: row_of
          text: Search
          match: normalized
        hints:
          css: input.btn1
        fingerprint: 7597c82cb4ec8e3c
        recorded_strategy: semantic_exact
    wait:
      for: navigation
      timeout_ms: 8000
    risk: safe
  - id: read_savings_balance
    description: read the savings balance
    action:
      type: extract
      target:
        role: cell
        scope:
          frame: content
        anchor:
          relation: adjacent_to
          text: Savings Balance
          match: normalized
        fingerprint: '6272691489291274'
        recorded_strategy: structural_anchor
      into: savings_balance
    wait:
      for: snapshot_stable
      timeout_ms: 3000
    risk: safe
  - id: read_account_status
    description: read the account status
    action:
      type: extract
      target:
        role: cell
        scope:
          frame: content
        anchor:
          relation: adjacent_to
          text: $812.30
          match: normalized
        fingerprint: a565b77dfbd0bf06
        recorded_strategy: structural_anchor
      into: account_status
    wait:
      for: snapshot_stable
      timeout_ms: 3000
    risk: safe
checkpoint:
  assert: all_of
  of:
    - assert: node_exists
      query:
        role: cell
        name_matches: ^\$?-?[0-9,]+\.[0-9]{2}$
        scope:
          frame: content
      min_count: 1
    - assert: node_exists
      query:
        role: cell
        name: Savings Balance
      min_count: 1
    - assert: node_exists
      query:
        role: cell
        name: Active
        scope:
          frame: content
      min_count: 1
    - assert: node_exists
      query:
        role: cell
        name: $812.30
      min_count: 1
escalation:
  triggers:
    - target_ambiguous
    - target_not_found
    - checkpoint_failed
    - recovery_exhausted
    - unexpected_state
  policy: pause_and_request_human
policy:
  max_steps: 40
  max_duration_ms: 120000
provenance:
  discovered_by:
    model: fake/scripted
    run_id: disc-7204db4d65
    at: '2026-09-11T21:16:28.326881+00:00'
  transcript_ref: evidence/discovery/demo-disc-1789161387/trace.jsonl
  notes: "Compiled from a single discovery run. Before approving, a reviewer should confirm:\n\n  1. Outcomes.\
    \ This run saw only the successful path, so NO business outcomes are declared. Every\n     legitimate\
    \ non-success answer this flow can return -- record not found, permission denied, a\n     closed account\
    \ -- must be added, or replay will classify each of them as UNEXPECTED_STATE and\n     escalate to\
    \ a human instead of answering the caller.\n  2. Recovery. No recovery rules are declared for the\
    \ same reason. Transient conditions this\n     application can produce (gateway errors, session expiry,\
    \ interstitial notices) need declaring.\n  3. Parameters. Check that the lifted inputs are the ones\
    \ that should vary per call, and that\n     nothing that should vary was left as a literal.\n  4.\
    \ Checkpoint. It asserts the shape of the extracted outputs. Confirm that is genuinely specific\n\
    \     to this goal rather than true of any page in the application.\n\nThese are gaps, not omissions:\
    \ inventing detectors a run never observed would produce a capability\nwhose error handling is fiction."

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovers a flow once, compiles it to a typed capability artifact, then replays it deterministically without the model in the loop."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.13.5,<3",
    "playwright>=1.63.0,<2",
    "fastapi>=0.142.2,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.32,<1",
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.3,<7",
    "typer>=0.27.2,<1",
    "python-dotenv>=1.2.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-timeout>=2.3,<3",
    # Line + branch coverage for the test report (scripts/test_report.py).
    "coverage>=7.6,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "import-linter>=2.0,<3",
    "types-PyYAML>=6.0,<7",
    # Renders REPORT.md into the documentation site (scripts/build_report_page.py).
    "markdown-it-py>=4.2.0,<5",
]

[project.scripts]
cua = "cua.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "TID"]
ignore = [
    "ANN401",  # Any is sometimes correct at boundaries we deliberately keep open
    "B008",    # typer/fastapi dependency-injection idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# The edge-case suites feed homoglyphs, right-to-left text, zero-width and line-separator characters
# to the system on purpose -- they are the subject under test, so "ambiguous unicode" is the point.
"tests/**/test_edge_*.py" = ["ANN", "RUF001", "RUF002", "RUF003"]
"apps/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["cua"]

[[tool.mypy.overrides]]
module = ["tests.*", "apps.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 120
markers = [
    "live: spends real LLM tokens against a live surface (deselected by default)",
    "browser: requires a real Chromium process",
    "slow: takes more than a few seconds",
]
addopts = "-ra --strict-markers -m 'not live'"
